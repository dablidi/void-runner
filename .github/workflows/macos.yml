name: Build VOID RUNNER for macOS

on:
  push:
    paths:
      - "void_runner.py"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce Nuitka

      - name: Build VOID RUNNER.app
        run: |
          python -m nuitka \
            --mode=app \
            --include-package=pygame \
            --product-name="VOID RUNNER" \
            --macos-app-version=1.0 \
            --output-dir=build \
            void_runner.py

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: VOID-RUNNER-macOS
          path: build/*.app
          include-hidden-files: true
